<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='200' height='200'>
  <!--
    Marble light square texture — Option A procedural SVG
    Generator parameters (reproducible):
      Base fill:      #F5F0E1  (warm cream)
      Turbulence:     type=fractalNoise, baseFrequency="0.018 0.035", numOctaves=4, seed=7
      Vein color:     near-white with warm ivory tone via feColorMatrix
      Blend:          feBlend mode=multiply over base fill
    Visual intent:   Warm Carrara marble — cream ground with subtle ivory/grey veining
  -->
  <defs>
    <filter id='marble-light' x='0%' y='0%' width='100%' height='100%' color-interpolation-filters='sRGB'>
      <feTurbulence type='fractalNoise' baseFrequency='0.018 0.035' numOctaves='4' seed='7' result='noise1'/>
      <feColorMatrix in='noise1' type='matrix'
        values='0.18 0 0 0 0.82
                0.14 0 0 0 0.79
                0.10 0 0 0 0.72
                0    0 0 1 0'
        result='tinted1'/>
      <feTurbulence type='fractalNoise' baseFrequency='0.055 0.08' numOctaves='3' seed='13' result='noise2'/>
      <feColorMatrix in='noise2' type='matrix'
        values='0.10 0 0 0 0.88
                0.08 0 0 0 0.85
                0.06 0 0 0 0.78
                0    0 0 0.4 0'
        result='tinted2'/>
      <feBlend in='tinted1' in2='tinted2' mode='multiply' result='veins'/>
      <feBlend in='SourceGraphic' in2='veins' mode='multiply' result='final'/>
    </filter>
  </defs>
  <rect width='200' height='200' fill='#F5F0E1' filter='url(#marble-light)'/>
</svg>
