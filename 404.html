<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChessCoach</title>
  <script>
    // SPA fallback for GitHub Pages
    // Encodes path/search/hash into the index.html ?/-prefixed query
    // so client-side routing can recover after a hard reload.
    (function () {
      var pathSegmentsToKeep = 1; // "/ChessCoach"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }());
  </script>
</head>
<body></body>
</html>
